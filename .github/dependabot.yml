# Dependabot — 커밋 SHA 로 고정한 액션 · 기반 이미지가 낡지 않게 매주 업데이트 PR (고정 + 갱신이 한 쌍)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directories: ["/", "/wazuh", "/inventory"]
    schedule: {interval: weekly}
    ignore:
      # 모델 파일(scikit-learn 1.5.2 로 저장)이 Python 버전에 묶여 있다 — 3.15 로 올리면 빌드가 깨짐 (2026-11-19 PR #1).
      # 패치(3.12.x)만 받고, minor/major 는 모델을 다시 학습할 때 함께 올린다.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
