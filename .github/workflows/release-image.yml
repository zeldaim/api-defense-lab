# 도구 이미지(detector · traffic · scorer · trainer) 빌드 → GHCR → 서명 · SBOM 증명 · SLSA 출처 증명
#
# 누구나 받은 이미지를 확인할 수 있다 (README "이미지 서명 · 출처 확인"):
#   cosign verify ghcr.io/zeldaim/api-defense-lab/tools:latest \
#     --certificate-identity https://github.com/zeldaim/api-defense-lab/.github/workflows/release-image.yml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/zeldaim/api-defense-lab/tools:latest --owner zeldaim
#
# 공급망 원칙: 액션은 태그가 아니라 커밋 SHA 로 고정(태그는 옮길 수 있다) · 권한은 작업에 필요한 것만 ·
#             서명은 키 파일 없이 이 워크플로의 신원(OIDC)으로 (keyless) — 서명 기록은 Sigstore 공개 로그(Rekor)에 남는다.
name: release-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - detector/**
      - traffic/**
      - scorer/**
      - spec/**
      - .github/workflows/release-image.yml
  workflow_dispatch:

permissions: {}                  # 기본은 아무 권한 없음 — 작업마다 필요한 것만 연다

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  build-sign:
    runs-on: ubuntu-24.04
    permissions:
      contents: read             # 체크아웃
      packages: write            # GHCR 에 올리기
      id-token: write            # keyless 서명 · 출처 증명용 OIDC 토큰
      attestations: write        # GitHub 출처 증명 저장
    env:
      IMAGE: ghcr.io/zeldaim/api-defense-lab/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 · 올리기
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=api-defense-lab tools image (detector, traffic, scorer, trainer)
            org.opencontainers.image.licenses=MIT
          provenance: false      # 출처 증명은 아래 GitHub 증명으로 한 번만 (중복 · 혼동 방지)
          sbom: false

      - name: SBOM (CycloneDX, Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: 서명 (cosign keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: SBOM 증명 붙이기 (cosign attest, CycloneDX)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

      - name: SLSA 출처 증명 (GitHub artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: 스스로 검증 (서명 신원 · SBOM 증명)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          ID: https://github.com/${{ github.repository }}/.github/workflows/release-image.yml@${{ github.ref }}
        run: |
          cosign verify "$REF" --certificate-identity "$ID" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$REF" --type cyclonedx --certificate-identity "$ID" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "서명 · SBOM 증명 검증 통과 ($ID)" >> "$GITHUB_STEP_SUMMARY"
