# 연습장 nginx — 접속 기록 + 차단 목록(/data/blocked/ips.map 의 IP 는 403).
# 출발지는 X-Client-IP 헤더(없으면 실제 주소) — 합성 트래픽이 여러 사용자를 흉내 내기 위한 연습장 전용 단순화다.
# 운영에서는 이 헤더를 믿으면 안 된다 (누구나 위조할 수 있다).
events {}
http {
  map $http_x_client_ip $client { "" $remote_addr; default $http_x_client_ip; }
  log_format lab '$client - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  map $client $blocked { default 0; include /data/blocked/ips.map; }
  server {
    listen 80;
    location = /__lab/health { access_log off; return 200 "ok\n"; }   # 헬스체크는 로그에 남기지 않는다 (ML 오탐 방지)
    location / {
      access_log /data/logs/access.log lab;
      if ($blocked) { return 403 '{"detail":"blocked by api-defense-lab auto-response"}'; }
      proxy_pass http://dvra-web:8091;
      proxy_set_header Host $host;
    }
  }
}
